[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = [
    "E501",   # line too long
    "E701",   # multiple statements on one line (colon)
    "E702",   # multiple statements on one line (semicolon)
    "F403",   # star import used (intentional in this project)
    "F405",   # undefined name from star import
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# ``testpaths`` keeps a bare ``pytest`` run scoped to the suite; ``pythonpath``
# puts the repository root on sys.path so tests import ``meridian`` on a fresh
# checkout without ``pip install -e .``.  Both are required for V-12: the suite
# must behave identically from the repository root and from any other cwd.
testpaths = ["tests"]
pythonpath = ["."]
